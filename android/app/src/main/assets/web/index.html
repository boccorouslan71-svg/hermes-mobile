<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hermes Mobile</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#0b1020;color:#f5f7ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#0b1020,#151031);min-height:100vh}.shell{max-width:760px;margin:auto;padding:20px}.header{display:flex;justify-content:space-between;align-items:center;padding:8px 0 20px}.brand{font-weight:800;font-size:1.35rem}.badge{font-size:.78rem;border:1px solid #3b4565;padding:6px 10px;border-radius:999px;color:#b9c3e6}.card{background:#141b32;border:1px solid #2a3559;border-radius:18px;padding:18px;box-shadow:0 16px 60px #0003}.status{display:flex;gap:10px;align-items:center;color:#aab7df;font-size:.9rem}.dot{height:9px;width:9px;background:#f59e0b;border-radius:50%}.dot.ready{background:#34d399}.messages{min-height:52vh;max-height:62vh;overflow:auto;padding:12px 0}.msg{padding:12px 14px;border-radius:14px;margin:10px 0;white-space:pre-wrap;line-height:1.45}.user{background:#3b2771;margin-left:16%}.agent{background:#1d2948;margin-right:10%}.composer{display:flex;gap:10px;margin-top:12px}.composer textarea{flex:1;background:#0c1327;border:1px solid #354264;border-radius:12px;color:#fff;padding:12px;resize:none;min-height:54px}.composer button{background:#8b5cf6;color:#fff;border:0;border-radius:12px;padding:0 18px;font-weight:700}.composer button:disabled,.composer textarea:disabled{opacity:.45}.meta{font-size:.78rem;color:#8492bd;margin-top:10px}.notice{color:#fbbf24}
</style>
</head>
<body><main class="shell"><header class="header"><div class="brand">Hermes Mobile</div><div class="badge">local-first agent</div></header><section class="card"><div class="status"><span id="dot" class="dot"></span><span id="status">Installation du runtime en cours…</span></div><div id="messages" class="messages"><div class="msg agent">Le serveur local démarre. Cette page reste disponible même avant le démarrage du bridge.</div></div><form id="form" class="composer"><textarea id="input" disabled placeholder="En attente du runtime Hermes…"></textarea><button id="send" disabled>Envoyer</button></form><div class="meta" id="meta">Initialisation locale — nouvelle tentative dans 2 secondes</div></section></main>
<script>
const BRIDGE='http://127.0.0.1:18923';
const $=id=>document.getElementById(id), messages=$('messages'), input=$('input'), send=$('send');
let bridgeReady=false, pollTimer=null;
function add(text,kind){const el=document.createElement('div');el.className='msg '+kind;el.textContent=text;messages.appendChild(el);messages.scrollTop=messages.scrollHeight}
function setReady(value){bridgeReady=value;input.disabled=!value;send.disabled=!value;input.placeholder=value?'Écrivez un message à Hermes…':'Installation du runtime en cours…'}
async function pollBridge(){
  try{
    const response=await fetch(BRIDGE+'/api/status',{cache:'no-store'});
    if(!response.ok)throw new Error('HTTP '+response.status);
    const state=await response.json();
    $('dot').classList.add('ready');
    if(state.hermesInstalled){$('status').textContent='Hermes est prêt localement';$('meta').textContent='Bridge local actif — '+state.prefix;setReady(true)}
    else if(state.installError){$('status').textContent='Serveur prêt, installation Hermes à corriger';$('meta').textContent=state.installError;setReady(false);$('meta').classList.add('notice')}
    else{$('status').textContent='Installation du runtime en cours…';$('meta').textContent='Serveur local actif — préparation de Python, Git et Hermes';setReady(false)}
  }catch(error){
    $('dot').classList.remove('ready');$('status').textContent='Installation du runtime en cours…';$('meta').textContent='Serveur local indisponible — nouvelle tentative dans 2 secondes';setReady(false)
  }finally{pollTimer=setTimeout(pollBridge,2000)}
}
$('form').addEventListener('submit',async e=>{e.preventDefault();const value=input.value.trim();if(!value||!bridgeReady)return;add(value,'user');input.value='';try{const r=await fetch(BRIDGE+'/api/message',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:value})}).then(x=>x.json());add(r.reply,'agent')}catch(err){add('Erreur de communication avec le bridge local.','agent')}});
setReady(false);pollBridge();
</script></body></html>
