<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hermes Mobile</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#0b1020;color:#f5f7ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#0b1020,#151031);min-height:100vh}.shell{max-width:760px;margin:auto;padding:20px}.header{display:flex;justify-content:space-between;align-items:center;padding:8px 0 20px}.brand{font-weight:800;font-size:1.35rem}.header-actions{display:flex;gap:8px;align-items:center}.badge,.icon-btn{font-size:.78rem;border:1px solid #3b4565;padding:6px 10px;border-radius:999px;color:#b9c3e6;background:transparent}.icon-btn{cursor:pointer;font-size:1rem;padding:6px 9px}.card{background:#141b32;border:1px solid #2a3559;border-radius:18px;padding:18px;box-shadow:0 16px 60px #0003}.status{display:flex;gap:10px;align-items:center;color:#aab7df;font-size:.9rem}.dot{height:9px;width:9px;background:#f59e0b;border-radius:50%}.dot.ready{background:#34d399}.messages{min-height:48vh;max-height:58vh;overflow:auto;padding:12px 0}.msg{padding:12px 14px;border-radius:14px;margin:10px 0;white-space:pre-wrap;line-height:1.45}.user{background:#3b2771;margin-left:16%}.agent{background:#1d2948;margin-right:10%}.composer{display:flex;gap:10px;margin-top:12px}.composer textarea{flex:1;background:#0c1327;border:1px solid #354264;border-radius:12px;color:#fff;padding:12px;resize:none;min-height:54px}.composer button,.primary{background:#8b5cf6;color:#fff;border:0;border-radius:12px;padding:0 18px;font-weight:700}.composer button{min-width:94px}.composer button:disabled,.composer textarea:disabled{opacity:.45}.meta{font-size:.78rem;color:#8492bd;margin-top:10px;white-space:pre-wrap}.notice{color:#fbbf24}.error-box{display:none;margin-top:12px;background:#281827;border:1px solid #743b56;border-radius:12px;padding:12px;color:#fecdd3}.error-box.visible{display:block}.error-box pre{white-space:pre-wrap;word-break:break-word;max-height:240px;overflow:auto;font:11px ui-monospace,monospace}.settings{display:none;margin-bottom:14px}.settings.open{display:block}.settings h2{font-size:1.05rem;margin:0 0 14px}.field{margin:11px 0}.field label{display:block;font-size:.82rem;color:#aab7df;margin-bottom:6px}.field input,.field select{width:100%;background:#0c1327;border:1px solid #354264;border-radius:10px;color:#fff;padding:11px}.setting-actions{display:flex;gap:10px;margin-top:14px}.secondary{background:#273454;color:#dbe4ff;border:0;border-radius:10px;padding:10px 14px}.saved{font-size:.8rem;color:#6ee7b7;margin-left:auto;align-self:center}
</style>
</head>
<body><main class="shell"><header class="header"><div class="brand">Hermes Mobile</div><div class="header-actions"><div class="badge">local-first agent</div><button id="settingsButton" class="icon-btn" aria-label="Settings" title="Settings">⚙️</button></div></header>
<section id="settingsPanel" class="card settings"><h2>Configuration Hermes</h2><div class="field"><label for="apiKey">API Key</label><input id="apiKey" type="password" autocomplete="off" placeholder="sk-… ou token du provider"></div><div class="field"><label for="baseUrl">Base URL</label><input id="baseUrl" type="url" placeholder="https://api.openai.com/v1"></div><div class="field"><label for="model">Modèle</label><input id="model" list="models" placeholder="gpt-4o-mini"><datalist id="models"><option value="gpt-4o-mini"><option value="gpt-4"><option value="claude-3-5-sonnet"><option value="hermes-3"><option value="nous-hermes-2"><option value="openrouter/auto"></datalist></div><div class="setting-actions"><button id="saveSettings" class="primary" type="button">Sauvegarder</button><button id="closeSettings" class="secondary" type="button">Fermer</button><span id="saved" class="saved"></span></div></section>
<section class="card"><div class="status"><span id="dot" class="dot"></span><span id="status">Installation du runtime en cours…</span></div><div id="messages" class="messages"><div class="msg agent">Le serveur local démarre. Cette page reste disponible même avant le démarrage du bridge.</div></div><form id="form" class="composer"><textarea id="input" disabled placeholder="En attente du runtime Hermes…"></textarea><button id="send" disabled>Envoyer</button></form><div class="meta" id="meta">Initialisation locale — nouvelle tentative dans 2 secondes</div><div id="errorBox" class="error-box"><strong>Diagnostic d’installation</strong><pre id="errorText"></pre></div></section></main>
<script>
const BRIDGE='http://127.0.0.1:18923';
const $=id=>document.getElementById(id), messages=$('messages'), input=$('input'), send=$('send');
let bridgeReady=false, pollTimer=null;
function add(text,kind){const el=document.createElement('div');el.className='msg '+kind;el.textContent=text;messages.appendChild(el);messages.scrollTop=messages.scrollHeight}
function setReady(value){bridgeReady=value;input.disabled=!value;send.disabled=!value;input.placeholder=value?'Écrivez un message à Hermes…':'Installation du runtime en cours…'}
function showDiagnostic(state){const detail=[state.installError||'',state.installLog||''].filter(Boolean).join('\n\n');$('errorText').textContent=detail;if(detail){$('errorBox').classList.add('visible');$('meta').classList.add('notice')}else{$('errorBox').classList.remove('visible');$('meta').classList.remove('notice')}}
async function pollBridge(){
 try{const response=await fetch(BRIDGE+'/api/status',{cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status);const state=await response.json();$('dot').classList.add('ready');showDiagnostic(state);
  if(state.hermesInstalled){$('status').textContent='Hermes est prêt localement';$('meta').textContent='Bridge local actif — configuration disponible dans ⚙️';setReady(true)}
  else if(state.installError){$('status').textContent='Serveur prêt, installation Hermes échouée';if(!state.installLog)$('meta').textContent=state.installError;setReady(false)}
  else{$('status').textContent='Installation du runtime en cours…';$('meta').textContent='Serveur local actif — préparation de Python, Git et Hermes';setReady(false)}
 }catch(error){$('dot').classList.remove('ready');$('status').textContent='Installation du runtime en cours…';$('meta').textContent='Serveur local indisponible — nouvelle tentative dans 2 secondes';setReady(false)}finally{pollTimer=setTimeout(pollBridge,2000)}}
async function loadConfig(){try{const config=await fetch(BRIDGE+'/api/config').then(r=>r.json());$('apiKey').value=config.apiKey||'';$('baseUrl').value=config.baseUrl||'https://api.openai.com/v1';$('model').value=config.model||'gpt-4o-mini'}catch(_){$('baseUrl').value='https://api.openai.com/v1';$('model').value='gpt-4o-mini'}}
$('settingsButton').addEventListener('click',()=>{$('settingsPanel').classList.toggle('open');if($('settingsPanel').classList.contains('open'))loadConfig()});$('closeSettings').addEventListener('click',()=>$('settingsPanel').classList.remove('open'));
$('saveSettings').addEventListener('click',async()=>{const payload={apiKey:$('apiKey').value,baseUrl:$('baseUrl').value.trim(),model:$('model').value.trim()};try{const r=await fetch(BRIDGE+'/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!r.ok)throw new Error('HTTP '+r.status);localStorage.setItem('hermesConfig',JSON.stringify(payload));$('saved').textContent='Paramètres sauvegardés localement';setTimeout(()=>$('saved').textContent='',2500)}catch(error){$('saved').textContent='Erreur de sauvegarde'}});
$('form').addEventListener('submit',async e=>{e.preventDefault();const value=input.value.trim();if(!value||!bridgeReady)return;add(value,'user');input.value='';try{const r=await fetch(BRIDGE+'/api/message',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:value})}).then(x=>x.json());add(r.reply,'agent')}catch(_){add('Erreur de communication avec le bridge local.','agent')}});
setReady(false);pollBridge();loadConfig();
</script></body></html>
