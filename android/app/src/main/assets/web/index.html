<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hermes Mobile</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#0b1020;color:#f5f7ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#0b1020,#151031);min-height:100vh}.shell{max-width:760px;margin:auto;padding:20px}.header{display:flex;justify-content:space-between;align-items:center;padding:8px 0 20px}.brand{font-weight:800;font-size:1.35rem}.badge{font-size:.78rem;border:1px solid #3b4565;padding:6px 10px;border-radius:999px;color:#b9c3e6}.card{background:#141b32;border:1px solid #2a3559;border-radius:18px;padding:18px;box-shadow:0 16px 60px #0003}.status{display:flex;gap:10px;align-items:center;color:#aab7df;font-size:.9rem}.dot{height:9px;width:9px;background:#f59e0b;border-radius:50%}.dot.ready{background:#34d399}.messages{min-height:52vh;max-height:62vh;overflow:auto;padding:12px 0}.msg{padding:12px 14px;border-radius:14px;margin:10px 0;white-space:pre-wrap;line-height:1.45}.user{background:#3b2771;margin-left:16%}.agent{background:#1d2948;margin-right:10%}.composer{display:flex;gap:10px;margin-top:12px}.composer textarea{flex:1;background:#0c1327;border:1px solid #354264;border-radius:12px;color:#fff;padding:12px;resize:none;min-height:54px}.composer button{background:#8b5cf6;color:#fff;border:0;border-radius:12px;padding:0 18px;font-weight:700}.meta{font-size:.78rem;color:#8492bd;margin-top:10px}
</style>
</head>
<body><main class="shell"><header class="header"><div class="brand">Hermes Mobile</div><div class="badge">local-first agent</div></header><section class="card"><div class="status"><span id="dot" class="dot"></span><span id="status">Démarrage du runtime local…</span></div><div id="messages" class="messages"><div class="msg agent">Bonjour. Je suis Hermes Mobile. Le serveur local attend le runtime Hermes embarqué.</div></div><form id="form" class="composer"><textarea id="input" placeholder="Écrivez un message à Hermes…"></textarea><button>Envoyer</button></form><div class="meta" id="meta">WebView → HTTP localhost:18923 → bridge Hermes</div></section></main>
<script>
const $=id=>document.getElementById(id), messages=$('messages');
function add(text,kind){const el=document.createElement('div');el.className='msg '+kind;el.textContent=text;messages.appendChild(el);messages.scrollTop=messages.scrollHeight}
async function status(){try{const s=await fetch('/api/status').then(r=>r.json());$('dot').classList.toggle('ready',s.ready);$('status').textContent=s.hermesInstalled?'Hermes est prêt localement':'Runtime prêt — binaire Hermes à installer';$('meta').textContent='Préfixe: '+s.prefix}catch(e){$('status').textContent='Serveur local indisponible'}}
$('form').addEventListener('submit',async e=>{e.preventDefault();const value=$('input').value.trim();if(!value)return;add(value,'user');$('input').value='';try{const r=await fetch('/api/message',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:value})}).then(x=>x.json());add(r.reply,'agent')}catch(err){add('Erreur de communication avec le bridge local.','agent')}});status();setInterval(status,5000);
</script></body></html>
