name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Download latest Termux ARM64 bootstrap
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, urllib.request
          api = 'https://api.github.com/repos/termux/termux-packages/releases/latest'
          req = urllib.request.Request(api, headers={'Accept': 'application/vnd.github+json', 'User-Agent': 'hermes-mobile-ci'})
          with urllib.request.urlopen(req) as response:
              release = json.load(response)
          assets = [a for a in release.get('assets', []) if a['name'] == 'bootstrap-aarch64.zip']
          if not assets:
              raise SystemExit(f"No bootstrap-aarch64.zip in {release.get('tag_name')}")
          asset = assets[0]
          pathlib.Path('/tmp/bootstrap-url').write_text(asset['browser_download_url'])
          pathlib.Path('/tmp/bootstrap-version').write_text(release.get('tag_name', 'unknown'))
          print(f"Using {release.get('tag_name')}: {asset['browser_download_url']}")
          PY
          mkdir -p android/app/src/main/assets
          curl --fail --location --retry 3 "$(cat /tmp/bootstrap-url)" -o android/app/src/main/assets/bootstrap-aarch64.zip
          sha256sum android/app/src/main/assets/bootstrap-aarch64.zip | tee android/app/src/main/assets/bootstrap-aarch64.zip.sha256
          printf 'termux_bootstrap=%s\n' "$(cat /tmp/bootstrap-version)" >> "$GITHUB_STEP_SUMMARY"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-mobile-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub release for tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/src/main/assets/bootstrap-aarch64.zip.sha256
